name: Firmware build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Prepare sketch as PlatformIO C++
        run: |
          mkdir -p src
          printf '#include <Arduino.h>\n' > src/main.cpp
          cat traccar.ino >> src/main.cpp
      - name: Compile ESP32 firmware
        run: pio run -e sim7000g
